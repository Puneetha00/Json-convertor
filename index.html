
<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <style>
        body {
            background-color: lightgray;
            font-family: Arial, sans-serif;
        }

        h3 {
            text-align: center;
            margin-top: 15px;
        }

        .calculator {
            text-align: center;
            margin-top: 15px;
        }

        input {
            display: block;
            margin: 7px auto;
            padding: 5px;
            width: 130px;
        }

        button {
            background-color: blue;
            color: white;
            border: none;
            padding: 7px;
            margin: 3px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        #result {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div>
        Name:Narisetty Puneetha<br>
        USN:1BI24CS137
    </div>

    <h3>Simple Calculator</h3>

    <div class="calculator">

        <input type="number" id="num1" placeholder="First number">

        <input type="number" id="num2" placeholder="Second number">

        <br>

        <button onclick="calculate('sum')">Sum</button>

        <button onclick="calculate('difference')">Difference</button>

        <button onclick="calculate('product')">Product</button>

        <button onclick="calculate('quotient')">Quotient</button>

        <button onclick="calculate('remainder')">Remainder</button>

        <button onclick="calculate('power')">Power</button>

        <button onclick="calculate('sqrt')">Square Root</button>

        <button onclick="calculate('square')">Square</button>

        <p id="result">Result:</p>

    </div>

    <script>

        function calculate(operation) {

            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);

            let result;

            if (document.getElementById("num1").value === "" ||
                (operation !== "sqrt" && operation !== "square" &&
                 document.getElementById("num2").value === "")) {

                document.getElementById("result").innerHTML =
                    "Please enter the required number(s)";
                return;
            }

            switch(operation) {

                case "sum":
                    result = a + b;
                    break;

                case "difference":
                    result = a - b;
                    break;

                case "product":
                    result = a * b;
                    break;

                case "quotient":
                    result = b !== 0 ? a / b : "Cannot divide by zero";
                    break;

                case "remainder":
                    result = b !== 0 ? a % b : "Cannot divide by zero";
                    break;

                case "power":
                    result = Math.pow(a, b);
                    break;

                case "sqrt":
                    result = a >= 0 ? Math.sqrt(a) : "Invalid input";
                    break;

                case "square":
                    result = a * a;
                    break;

            }

            document.getElementById("result").innerHTML =
                "Result: " + result;

        }

    </script>

</body>
</html>
