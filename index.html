
<!DOCTYPE html>
<html>
<head>
    <title>JSON Converter</title>

    <style>
        body {
            background-color: lightgray;
            font-family: Arial, sans-serif;
        }

        h3 {
            text-align: center;
            margin-top: 15px;
        }

        textarea {
            display: block;
            width: 80%;
            height: 95px;
            margin: 20px auto;
            padding: 5px;
            resize: both;
        }

        .buttons {
            text-align: center;
        }

        button {
            background-color: blue;
            color: white;
            border: none;
            padding: 7px;
            margin: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <div>
        Name:Narisetty Puneetha<br>
        USN:1BI24CS137
    </div>

    <h3>JSON Converter</h3>

    <textarea id="input" placeholder="Enter JSON or CSV or String"></textarea>

    <div class="buttons">

        <button onclick="convert('object')">JSON to Object</button>

        <button onclick="convert('date')">JSON to Date</button>

        <button onclick="convert('jsoncsv')">JSON to CSV</button>

        <button onclick="convert('csvjson')">CSV to JSON</button>

        <button onclick="convert('hash')">SHA-256 Hash</button>

    </div>

    <textarea id="output" placeholder="Output will appear here" readonly></textarea>

    <script>

        async function convert(operation) {

            let input = document.getElementById("input").value;
            let output = document.getElementById("output");

            try {

                switch(operation) {

                    case "object":

                        let obj = JSON.parse(input);

                        output.value = JSON.stringify(obj, null, 4);

                        break;


                    case "date":

                        let dateData = JSON.parse(input);

                        function convertDates(data) {

                            if (typeof data === "string" &&
                                !isNaN(Date.parse(data))) {

                                return new Date(data).toString();

                            }

                            if (Array.isArray(data)) {
                                return data.map(convertDates);
                            }

                            if (data !== null && typeof data === "object") {

                                let result = {};

                                for (let key in data) {
                                    result[key] = convertDates(data[key]);
                                }

                                return result;
                            }

                            return data;
                        }

                        output.value = JSON.stringify(
                            convertDates(dateData), null, 4
                        );

                        break;


                    case "jsoncsv":

                        let json = JSON.parse(input);

                        if (!Array.isArray(json) || json.length === 0) {
                            throw new Error("Enter a non-empty JSON array");
                        }

                        let headers = Object.keys(json[0]);

                        let csv = [
                            headers.join(","),
                            ...json.map(row =>
                                headers.map(key =>
                                    '"' + String(row[key] ?? "")
                                    .replace(/"/g, '""') + '"'
                                ).join(",")
                            )
                        ].join("\n");

                        output.value = csv;

                        break;


                    case "csvjson":

                        let lines = input.trim().split(/\r?\n/);

                        function parseCSVLine(line) {
                            let values = [];
                            let value = "";
                            let insideQuotes = false;

                            for (let i = 0; i < line.length; i++) {

                                let ch = line[i];

                                if (ch === '"') {

                                    if (insideQuotes && line[i + 1] === '"') {
                                        value += '"';
                                        i++;
                                    } else {
                                        insideQuotes = !insideQuotes;
                                    }

                                } else if (ch === "," && !insideQuotes) {

                                    values.push(value);
                                    value = "";

                                } else {
                                    value += ch;
                                }
                            }

                            values.push(value);
                            return values;
                        }

                        let keys = parseCSVLine(lines[0]);

                        let records = lines.slice(1).map(line => {

                            let values = parseCSVLine(line);
                            let obj = {};

                            keys.forEach((key, index) => {
                                obj[key] = values[index] || "";
                            });

                            return obj;
                        });

                        output.value = JSON.stringify(records, null, 4);

                        break;


                    case "hash":

                        let data = new TextEncoder().encode(input);

                        let hash = await crypto.subtle.digest("SHA-256", data);

                        let hashArray = Array.from(new Uint8Array(hash));

                        output.value = hashArray.map(
                            byte => byte.toString(16).padStart(2, "0")
                        ).join("");

                        break;

                }

            } catch(error) {

                output.value = "Error: " + error.message;

            }

        }

    </script>

</body>
</html>
